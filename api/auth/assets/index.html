<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API ECOMMERCE</title>
</head>
<body>
    <h1>Hello World</h1>



    <script>
        async function postLogin(){
            const response = await fetch(`/auth/login`,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({email:"rafa@gmail.com",password:"rafa"})
            })
            const dados= await response.json()
            console.log(dados)
        }
        async function CreateUser(){
            const response = await fetch(`/auth/create`,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({name:"Rafa",email:"rafa@gmail.com",password:"rafa",cep:"99708-304"})
            })
            const dados= await response.json()
            console.log(dados)
        }
        async function updateData(){
            const response = await fetch(`/auth/update`,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                credentials:"include",
                body:JSON.stringify({name:"Rafa The",email:"rafa@gmail.com",password:"rafa"})
            })
            const dados= await response.json()
            console.log(dados)
        }    
        async function session(){
            const response = await fetch(`/auth/session`,{
                method:"GET"
            })
            const dados= await response.json()
            console.log(dados)
        }
        async function getAllDados(){
            const response = await fetch(`/auth/dados`,{
                method:"GET",
                credentials:"include"
            })
            const dados= await response.json()
            console.log(dados)
        }
        async function userLogout(){
            const response = await fetch(`/auth/logout`,{
                method:"DELETE",
                headers:{
                    'Content-Type':"application/json"
                },
                credentials:"include"
            })
            const dados= await response.json()
            console.log(dados)
        }
        // session()
        // getAllDados()
        // updateData()
        // postLogin()
        // CreateUser()
        // userLogout()
    </script>
</body>
</html>
