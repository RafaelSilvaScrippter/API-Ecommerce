<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post publicação</title>
</head>
<body>
    <h1>Teste</h1>

    <img src="/read/image/product/1787071990675-foto.png" alt="">

    <form method="POST" enctype="multipart/form-data" action="/upload/product">
    <label for="filefield">Single file upload:</label><br>
    <input type="file" name="filefield">
    <input data-upload type="submit">
</form>

    <script>

        const dataUpload = document.querySelector("[data-upload]")

        async function postPublish(){
            const response = await fetch('/post/publish',{
                method:"POST",
                headers:{
                    'Content-Type':"application/json"
                },
                credentials:"include",
                body:JSON.stringify({name:"Notebook",price:"2000",description:"Um notebook"})
            })
            const dados = await response.json()
            console.log(dados)
        }
        dataUpload.addEventListener("click",(e) => {
            postPublish()
        })

    async function posts(){
